<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscribe | Rudrix Technologies</title>
<meta name="description" content="Subscribe to stay updated on Accounting & Finance, Data Analysis, AI Engineering, Personal Branding, and the latest AI & Technology trends.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#000;--paper:#fff;--accent:#e040fb;--ok:#16a34a;--bad:#dc2626;--muted:#555}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}
  header{border-bottom:2px solid var(--ink);padding:16px clamp(20px,5vw,56px)}
  .logo{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
  .logo img{height:44px;width:auto;display:block;padding:6px 12px;border:2px solid var(--ink);border-radius:8px;background:var(--paper)}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 20px}
  .wrap{width:100%;max-width:640px}
  h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1.05;font-weight:700;letter-spacing:-.03em;margin-bottom:20px}
  .lead{font-size:1.05rem;line-height:1.6;color:var(--muted);max-width:52ch;margin-bottom:36px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  input[type=email]{flex:1 1 260px;min-width:0;font:inherit;font-size:1rem;padding:16px 18px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:8px;outline:none;transition:box-shadow .15s,border-color .15s}
  input[type=email]::placeholder{color:#8a8a8a}
  input[type=email]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(224,64,251,.35)}
  button{font:inherit;font-size:1rem;font-weight:600;padding:16px 26px;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:8px;cursor:pointer;box-shadow:5px 5px 0 var(--ink);transition:transform .12s,box-shadow .12s}
  button:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink)}
  button:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
  button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  button:disabled{opacity:.6;cursor:wait}
  #msg{min-height:1.6em;margin-top:18px;font-weight:600;font-size:1rem}
  #msg.ok{color:#16a34a;font-weight:700}
  #msg.err{color:var(--bad)}
  .note{margin-top:28px;padding-top:20px;border-top:1px solid #ddd;font-size:.92rem;line-height:1.6;color:var(--muted)}
  footer{border-top:2px solid var(--ink);padding:26px clamp(20px,5vw,56px);display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between}
  .contact{display:flex;align-items:center;gap:14px}
  .contact strong{font-weight:600;margin-right:4px}
  .contact a{width:42px;height:42px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:8px;color:var(--ink);background:var(--paper);box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
  .contact a:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .contact a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .contact svg{width:20px;height:20px}
  .power{font-size:.95rem;color:var(--muted)}
  .power b{color:var(--ink);font-weight:600}
  @media(max-width:520px){button{width:100%}footer{flex-direction:column;align-items:flex-start}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
  // ▼ Paste your Google Apps Script Web App URL here
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3fdVI7yTdg1nV2r6SCs6C1h_5_EegnJcPkpeLSyx4rD4ijeBE-5z-wnLPiP_A4kPxhQ/exec";

  const form = document.getElementById('form');
  const emailEl = document.getElementById('email');
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');
  const valid = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);

  function show(text, type){ msg.textContent = text; msg.className = type || ''; }

  form.addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const email = emailEl.value.trim().toLowerCase();
    if (!valid(email)) return show('Please enter a valid email address.', 'err');
    if (SCRIPT_URL.indexOf('PASTE_') === 0) return show('Setup incomplete: add the Apps Script URL.', 'err');

    btn.disabled = true; show('Subscribing…');
    try {
      const res = await fetch(SCRIPT_URL, { method:'POST', body:new URLSearchParams({ email }) });
      const data = await res.json();
      if (data.status === 'success') { show('Successfully Subscribed!', 'ok'); form.reset(); }
      else if (data.status === 'duplicate') show('This email is already subscribed.', 'err');
      else show('Something went wrong. Please try again.', 'err');
    } catch (err) {
      // Fallback: if the browser blocks reading the reply, still send the email
      try {
        await fetch(SCRIPT_URL, { method:'POST', mode:'no-cors', body:new URLSearchParams({ email }) });
        show('Successfully Subscribed!', 'ok'); form.reset();
      } catch (e2) {
        show('Network error. Please try again.', 'err');
      }
    } finally { btn.disabled = false; }
  });
</script>
